plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.feedflow'
version = '0.0.1-SNAPSHOT'
description = 'FeedFlow - 배합사료 유통 관리 플랫폼 (Admin & Dashboard Module)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web / View
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Security (+ Thymeleaf Security Dialect for Spring Boot 3.x)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // H2 (In-memory)
    runtimeOnly 'com.h2database:h2'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------
// 인코딩 고정 (UTF-8)
//
// 소스 · 리소스 · 테스트 실행 · 문서화의 인코딩을 모두 명시한다.
// 한 곳이라도 빠지면 그 단계에서만 OS 기본 인코딩(한국어 Windows = MS949)이
// 쓰여 한글이 깨진다. 실제로 테스트 실행 인코딩이 빠져 있어
// 빌드 로그의 한글 테스트 이름이 깨져 보였다.
// ---------------------------------------------------------------------

tasks.withType(Copy).configureEach {
    // application.properties, data.sql, 템플릿 등 리소스 복사 시
    filteringCharset = 'UTF-8'
}

tasks.withType(Test).configureEach {
    // 테스트 JVM 은 별도 프로세스라 gradle.properties 의 설정이 적용되지 않는다
    defaultCharacterEncoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    // 한글 소스/리소스가 있으므로 인코딩 고정
    options.encoding = 'UTF-8'
    // 메서드 파라미터 이름을 클래스 파일에 보존
    // (Spring Data 의 :파라미터, @RequestParam 등에서 이름 추론에 사용)
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
}
