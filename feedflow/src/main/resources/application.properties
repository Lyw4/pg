spring.application.name=feedflow

# ---------------------------------------------------------------------
# H2 In-Memory Database
#  - H2 Console : http://localhost:8080/h2-console
#  - JDBC URL   : jdbc:h2:mem:feedflow / User: sa / Password: (empty)
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:feedflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# Create schema on startup (development only)
spring.jpa.hibernate.ddl-auto=create

# Keep identifiers exactly as declared (camelCase).
# Spring Boot's default strategy converts camelCase into snake_case
# (productId -> product_id); this project uses camelCase for all
# table and column names, so the standard strategy is used instead.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Run data.sql AFTER Hibernate has created the schema
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# ---------------------------------------------------------------------
# Initial data (data.sql)
# ---------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------------------------------------------------------------------
# Thymeleaf (disable cache so template changes are picked up)
# ---------------------------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------
# Logging
#  - Uncomment to also log SQL bind parameters (very verbose)
# ---------------------------------------------------------------------
#logging.level.org.hibernate.orm.jdbc.bind=trace

# ---------------------------------------------------------------------
# Admin dashboard custom settings
# ---------------------------------------------------------------------
# Expiration alert threshold in days
feedflow.dashboard.expiration-alert-days=30
# Default number of days for the sales trend chart
feedflow.dashboard.chart-default-days=7
