# =====================================================================
# FeedFlow - Admin & Dashboard module
#
# NOTE: Comments in this file are intentionally ASCII-only.
#   .properties is specified as ISO-8859-1 in the Java platform, and most
#   IDEs (Eclipse/STS in particular) open .properties with that encoding by
#   default. Korean comments saved as UTF-8 therefore render as mojibake
#   depending on the reader's settings.
#   Keeping this file ASCII-only makes it readable everywhere without
#   relying on per-machine IDE configuration.
#   Korean explanations live in the Java code and /docs instead.
# =====================================================================
spring.application.name=feedflow

# ---------------------------------------------------------------------
# H2 in-memory database
#   H2 console : http://localhost:8080/h2-console
#   JDBC URL   : jdbc:h2:mem:feedflow / user: sa / password: (empty)
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:feedflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# Recreate the schema on every startup (development only)
spring.jpa.hibernate.ddl-auto=create

# Use declared names as-is, i.e. keep camelCase for tables and columns.
#   - Spring Boot's default strategy converts camelCase to snake_case
#     (productId -> product_id).
#   - This project names every table/column in camelCase, so the standard
#     (non-converting) strategy is pinned here.
#   - Removing this line reverts the whole schema to snake_case.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Run data.sql AFTER Hibernate has created the schema
spring.jpa.defer-datasource-initialization=true

# Do not keep the persistence context open during view rendering.
# Lazy loading must be resolved in the service layer.
spring.jpa.open-in-view=false

# Print executed SQL to the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# ---------------------------------------------------------------------
# Initial data (data.sql)
# ---------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------------------------------------------------------------------
# Thymeleaf (disable cache so template edits apply immediately)
# ---------------------------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------
# Logging
#   Uncomment the line below to also print SQL bind parameters.
#   Warning: this produces a very large amount of log output.
# ---------------------------------------------------------------------
#logging.level.org.hibernate.orm.jdbc.bind=trace

# ---------------------------------------------------------------------
# Admin dashboard custom settings
# ---------------------------------------------------------------------
# Expiration alert threshold in days (see DashboardService)
feedflow.dashboard.expiration-alert-days=30
# Default number of days for the sales trend chart
feedflow.dashboard.chart-default-days=7
