# =====================================================================
# FeedFlow - 관리자 및 대시보드 모듈 설정
#
# [인코딩 안내]
#   이 파일은 UTF-8 로 저장되어 있다.
#   .properties 는 Java 명세상 ISO-8859-1 이라, 편집기가 그 규칙대로 열면
#   한글 주석이 깨져 보인다.
#   그래서 .settings/org.eclipse.core.resources.prefs 에 이 파일의 인코딩을
#   UTF-8 로 고정해 두었다. 이클립스에서 프로젝트를 다시 가져오면 자동 적용된다.
#
#   그래도 깨져 보이면 파일을 닫고 다시 열거나,
#   프로젝트 우클릭 > Properties > Resource > Text file encoding > UTF-8 로 설정한다.
# =====================================================================
spring.application.name=feedflow

# ---------------------------------------------------------------------
# H2 인메모리 데이터베이스
#  - H2 콘솔  : http://localhost:8080/h2-console
#  - JDBC URL : jdbc:h2:mem:feedflow / 사용자: sa / 비밀번호: (없음)
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:feedflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# 애플리케이션 시작 시 스키마 생성 (개발 단계 전용)
spring.jpa.hibernate.ddl-auto=create

# 선언한 이름을 그대로 사용 (카멜 표기법 유지)
#  · Spring Boot 기본 전략은 카멜 표기법을 스네이크 표기법으로 변환한다.
#    (productId -> product_id)
#  · 이 프로젝트는 모든 테이블/컬럼명을 카멜 표기법으로 쓰기 때문에
#    변환하지 않는 표준 전략으로 고정한다.
#  · 이 설정을 지우면 전체 스키마가 스네이크 표기법으로 되돌아간다.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Hibernate 가 스키마를 생성한 '뒤에' data.sql 을 실행한다
spring.jpa.defer-datasource-initialization=true

# 영속성 컨텍스트를 뷰 렌더링까지 열어두지 않는다 (지연 로딩은 서비스 계층에서 처리)
spring.jpa.open-in-view=false

# 실행되는 SQL 을 콘솔에 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# ---------------------------------------------------------------------
# 초기 데이터 (data.sql)
# ---------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------------------------------------------------------------------
# Thymeleaf (템플릿 수정이 바로 반영되도록 캐시 비활성화)
# ---------------------------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------
# 로깅
#  - 아래 줄의 주석을 해제하면 SQL 바인딩 파라미터까지 출력된다 (로그가 매우 많아짐)
# ---------------------------------------------------------------------
#logging.level.org.hibernate.orm.jdbc.bind=trace

# ---------------------------------------------------------------------
# 관리자 대시보드 커스텀 설정
# ---------------------------------------------------------------------
# 유통기한 임박 알림 기준일 (일)
feedflow.dashboard.expiration-alert-days=30
# 매출 추이 차트 기본 조회 일수
feedflow.dashboard.chart-default-days=7
