spring:
  application:
    name: feedflow

  # ------------------------------------------------------------------
  # H2 In-Memory Database
  # ------------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:feedflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # 애플리케이션 시작 시 스키마 생성 (개발 단계)
      ddl-auto: create
    # 스키마 생성이 끝난 뒤에 data.sql 을 실행시키기 위한 옵션
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  sql:
    init:
      mode: always
      encoding: UTF-8

  thymeleaf:
    cache: false

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace   # 바인딩 파라미터 확인용 (필요없으면 제거)

# ------------------------------------------------------------------
# 관리자 대시보드 관련 커스텀 설정
# ------------------------------------------------------------------
feedflow:
  dashboard:
    # 유통기한 임박 기준일 (일)
    expiration-alert-days: 30
    # 매출 추이 차트 기본 조회 일수
    chart-default-days: 7
