<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('창고 구역 등록/수정')}"></head>

<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>

<div class="ff-content">

    <div th:replace="~{fragments/layout :: topbar('기준 정보', '창고 구역 등록/수정')}"></div>

    <main class="ff-main">

        <div class="card ff-card ff-form-card">
            <div class="card-header bg-white border-0 pt-3">
                <span class="fw-bold">
                    <i class="bi bi-grid-3x3-gap-fill me-1"></i>
                    <span th:text="${editMode} ? '창고 구역 수정' : '창고 구역 등록'">창고 구역 등록</span>
                </span>
            </div>

            <div class="card-body">
                <form th:object="${binForm}" th:action="@{${formAction}}" method="post" novalidate>

                    <div class="row g-3">

                        <!-- 구역 코드 -->
                        <div class="col-12 col-md-6">
                            <label for="binCode" class="form-label ff-required">구역 코드</label>
                            <input type="text" id="binCode" th:field="*{binCode}"
                                   class="form-control ff-code"
                                   th:classappend="${#fields.hasErrors('binCode')} ? 'is-invalid'"
                                   placeholder="예: A-01-02" autofocus>
                            <div class="invalid-feedback" th:errors="*{binCode}">오류</div>
                            <div class="form-text">구역-랙-단 조합으로 입력하는 것을 권장합니다. (중복 불가)</div>
                        </div>

                        <!-- 창고(동) -->
                        <div class="col-6 col-md-3">
                            <label for="warehouse" class="form-label ff-required">창고</label>
                            <select id="warehouse" th:field="*{warehouse}" class="form-select"
                                    th:classappend="${#fields.hasErrors('warehouse')} ? 'is-invalid'">
                                <option th:each="wh : ${warehouses}" th:value="${wh}"
                                        th:text="${wh.description}">제1창고</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{warehouse}">오류</div>
                        </div>

                        <!-- 구역(Zone) -->
                        <div class="col-6 col-md-3">
                            <label for="zone" class="form-label ff-required">구역(Zone)</label>
                            <input type="text" id="zone" th:field="*{zone}" class="form-control"
                                   list="zoneOptions"
                                   th:classappend="${#fields.hasErrors('zone')} ? 'is-invalid'"
                                   placeholder="예: A, B, COLD">
                            <datalist id="zoneOptions">
                                <option th:each="z : ${zones}" th:value="${z}"></option>
                            </datalist>
                            <div class="invalid-feedback" th:errors="*{zone}">오류</div>
                        </div>

                        <!-- 구역 용도 -->
                        <div class="col-12 col-md-6">
                            <label for="binPurpose" class="form-label ff-required">구역 용도</label>
                            <select id="binPurpose" th:field="*{binPurpose}" class="form-select"
                                    th:classappend="${#fields.hasErrors('binPurpose')} ? 'is-invalid'">
                                <option th:each="p : ${binPurposes}" th:value="${p}"
                                        th:text="${p.description}">보관</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{binPurpose}">오류</div>
                            <div class="form-text">
                                입고/출고 대기 · 검수 구역은 창고 적재율 통계에서 제외됩니다.
                            </div>
                        </div>

                        <!-- 랙 -->
                        <div class="col-6 col-md-4">
                            <label for="rack" class="form-label">랙 번호</label>
                            <input type="text" id="rack" th:field="*{rack}" class="form-control"
                                   th:classappend="${#fields.hasErrors('rack')} ? 'is-invalid'"
                                   placeholder="예: 01">
                            <div class="invalid-feedback" th:errors="*{rack}">오류</div>
                        </div>

                        <!-- 단(층) -->
                        <div class="col-6 col-md-4">
                            <label for="binLevel" class="form-label ff-required">단(층)</label>
                            <input type="number" id="binLevel" th:field="*{binLevel}" class="form-control"
                                   th:classappend="${#fields.hasErrors('binLevel')} ? 'is-invalid'"
                                   min="1" max="99">
                            <div class="invalid-feedback" th:errors="*{binLevel}">오류</div>
                        </div>

                        <!-- 최대 적재 -->
                        <div class="col-6 col-md-4">
                            <label for="maxCapacity" class="form-label ff-required">최대 적재 (포대)</label>
                            <input type="number" id="maxCapacity" th:field="*{maxCapacity}" class="form-control"
                                   th:classappend="${#fields.hasErrors('maxCapacity')} ? 'is-invalid'"
                                   min="1">
                            <div class="invalid-feedback" th:errors="*{maxCapacity}">오류</div>
                        </div>

                        <!-- 2D 도면 배치 -->
                        <div class="col-12">
                            <hr class="mt-2 mb-3">
                            <div class="fw-semibold mb-1">
                                <i class="bi bi-bounding-box me-1"></i>2D 도면 배치
                            </div>
                            <div class="form-text mb-2">
                                창고 평면을
                                <span th:text="${gridColumns}">24</span> x
                                <span th:text="${gridRows}">18</span>
                                격자로 보고 사각형의 좌상단 위치와 크기를 지정합니다.
                                (1행 1열이 왼쪽 위)
                            </div>
                            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2 small">
                                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">오류</div>
                            </div>
                        </div>

                        <div class="col-6 col-md-3">
                            <label for="posX" class="form-label ff-required">가로 위치 (열)</label>
                            <input type="number" id="posX" th:field="*{posX}" class="form-control"
                                   th:classappend="${#fields.hasErrors('posX')} ? 'is-invalid'"
                                   min="1" th:max="${gridColumns}">
                            <div class="invalid-feedback" th:errors="*{posX}">오류</div>
                        </div>

                        <div class="col-6 col-md-3">
                            <label for="posY" class="form-label ff-required">세로 위치 (행)</label>
                            <input type="number" id="posY" th:field="*{posY}" class="form-control"
                                   th:classappend="${#fields.hasErrors('posY')} ? 'is-invalid'"
                                   min="1" th:max="${gridRows}">
                            <div class="invalid-feedback" th:errors="*{posY}">오류</div>
                        </div>

                        <div class="col-6 col-md-3">
                            <label for="posWidth" class="form-label ff-required">가로 크기</label>
                            <input type="number" id="posWidth" th:field="*{posWidth}" class="form-control"
                                   th:classappend="${#fields.hasErrors('posWidth')} ? 'is-invalid'"
                                   min="1" th:max="${gridColumns}">
                            <div class="invalid-feedback" th:errors="*{posWidth}">오류</div>
                        </div>

                        <div class="col-6 col-md-3">
                            <label for="posHeight" class="form-label ff-required">세로 크기</label>
                            <input type="number" id="posHeight" th:field="*{posHeight}" class="form-control"
                                   th:classappend="${#fields.hasErrors('posHeight')} ? 'is-invalid'"
                                   min="1" th:max="${gridRows}">
                            <div class="invalid-feedback" th:errors="*{posHeight}">오류</div>
                        </div>

                        <!-- 비고 -->
                        <div class="col-12">
                            <label for="memo" class="form-label">비고</label>
                            <input type="text" id="memo" th:field="*{memo}" class="form-control"
                                   th:classappend="${#fields.hasErrors('memo')} ? 'is-invalid'"
                                   placeholder="예: 저온 보관 구역">
                            <div class="invalid-feedback" th:errors="*{memo}">오류</div>
                        </div>

                        <!-- 사용 여부 -->
                        <div class="col-12">
                            <label class="form-label d-block">사용 여부</label>
                            <div class="form-check form-switch mt-1">
                                <input class="form-check-input" type="checkbox" role="switch"
                                       id="active" th:field="*{active}">
                                <label class="form-check-label" for="active">사용</label>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg me-1"></i>
                            <span th:text="${editMode} ? '수정 저장' : '등록'">등록</span>
                        </button>
                        <a th:href="@{/admin/bins}" class="btn btn-outline-secondary">취소</a>
                    </div>
                </form>
            </div>
        </div>

    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
