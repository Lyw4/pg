<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('입출고 이력')}"></head>

<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>

<div class="ff-content">

    <div th:replace="~{fragments/layout :: topbar('재고 관리', '입출고 이력')}"></div>

    <main class="ff-main">

        <!-- 검색 필터 -->
        <div class="card ff-card ff-filter-card mb-3">
            <div class="card-body">
                <form th:action="@{/admin/inventory/movements}" method="get" class="row g-2 align-items-end">
                    <div class="col-6 col-md-3">
                        <label for="movementType" class="form-label">이동 유형</label>
                        <select id="movementType" name="movementType" class="form-select form-select-sm">
                            <option value="">전체</option>
                            <option th:each="t : ${movementTypes}"
                                    th:value="${t.name()}"
                                    th:text="${t.description}"
                                    th:selected="${selectedMovementType != null and t == selectedMovementType}">
                            </option>
                        </select>
                    </div>

                    <div class="col-6 col-md-4">
                        <label for="productId" class="form-label">품목</label>
                        <select id="productId" name="productId" class="form-select form-select-sm">
                            <option value="">전체</option>
                            <option th:each="p : ${products}"
                                    th:value="${p.productId}"
                                    th:text="${p.productCode} + ' | ' + ${p.name}"
                                    th:selected="${selectedProductId != null and p.productId == selectedProductId}">
                            </option>
                        </select>
                    </div>

                    <div class="col-12 col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-sm btn-dark flex-grow-1">
                            <i class="bi bi-search me-1"></i>검색
                        </button>
                        <a th:href="@{/admin/inventory/movements}" class="btn btn-sm btn-outline-secondary">초기화</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- 이력 목록 -->
        <div class="card ff-card">
            <div class="card-header bg-white border-0 pt-3">
                <span class="fw-bold"><i class="bi bi-clock-history me-1"></i>입출고 이력</span>
                <span class="text-muted small ms-2">
                    총 <span th:text="${movements.totalElements}">0</span>건
                </span>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th class="text-center" style="width: 90px;">유형</th>
                            <th class="text-center" style="width: 150px;">처리 시각</th>
                            <th style="width: 120px;">품목 코드</th>
                            <th>품목명</th>
                            <th style="width: 190px;">로트번호</th>
                            <th style="width: 100px;">구역</th>
                            <th class="text-end" style="width: 90px;">수량</th>
                            <th style="width: 110px;">처리자</th>
                            <th>비고</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${movements.empty}">
                            <td colspan="9" class="text-center text-muted py-4">이력이 없습니다.</td>
                        </tr>

                        <tr th:each="mv : ${movements.content}">
                            <td class="text-center">
                                <span class="badge" th:classappend="${mv.typeBadgeClass}"
                                      th:text="${mv.typeLabel}">입고</span>
                            </td>
                            <td class="text-center small text-muted"
                                th:text="${#temporals.format(mv.createdAt, 'yyyy-MM-dd HH:mm')}">-</td>
                            <td><span class="ff-code" th:text="${mv.productCode}">CODE</span></td>
                            <td th:text="${mv.productName}">품목명</td>
                            <td><span class="ff-code small" th:text="${mv.lotNo}">LOT</span></td>
                            <td><span class="ff-code" th:text="${mv.binCode} ?: '-'">-</span></td>
                            <td class="text-end fw-semibold"
                                th:classappend="${mv.quantityTextClass}"
                                th:text="${mv.signedQuantity}">+0</td>
                            <td class="small" th:text="${mv.userName} ?: '-'">-</td>
                            <td class="small text-muted" th:text="${mv.memo} ?: '-'">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 페이지 네비게이션 -->
                <nav th:if="${movements.totalPages > 1}" class="mt-3">
                    <ul class="pagination pagination-sm justify-content-center mb-0">
                        <li class="page-item" th:classappend="${movements.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/admin/inventory/movements(movementType=${selectedMovementType},
                                          productId=${selectedProductId}, page=${movements.number - 1})}">이전</a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, movements.totalPages - 1)}"
                            th:classappend="${i == movements.number} ? 'active'">
                            <a class="page-link"
                               th:href="@{/admin/inventory/movements(movementType=${selectedMovementType},
                                          productId=${selectedProductId}, page=${i})}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <li class="page-item" th:classappend="${movements.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/admin/inventory/movements(movementType=${selectedMovementType},
                                          productId=${selectedProductId}, page=${movements.number + 1})}">다음</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
