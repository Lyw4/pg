<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('재고 현황')}"></head>

<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>

<div class="ff-content">

    <div th:replace="~{fragments/layout :: topbar('재고 관리 · 재고 현황')}"></div>

    <main class="ff-main">

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i>
            <span th:text="${successMessage}">처리 완료</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- 요약 카드 -->
        <div class="row g-3 mb-3">
            <div class="col-6 col-xl-3">
                <div class="card ff-card h-100">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-muted small">적재 위치 수</div>
                            <div class="ff-stat-value text-dark"
                                 th:text="${#numbers.formatInteger(stockedLocationCount, 1, 'COMMA')}">0</div>
                        </div>
                        <div class="ff-stat-icon bg-secondary-subtle text-secondary">
                            <i class="bi bi-geo-alt"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-6 col-xl-3">
                <div class="card ff-card h-100">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-muted small">총 보관 수량</div>
                            <div class="ff-stat-value text-primary"
                                 th:text="${#numbers.formatInteger(totalStoredQuantity, 1, 'COMMA')}">0</div>
                        </div>
                        <div class="ff-stat-icon bg-primary-subtle text-primary">
                            <i class="bi bi-stack"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-6 col-xl-3">
                <div class="card ff-card h-100">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-muted small">오늘 입고 건수</div>
                            <div class="ff-stat-value text-success"
                                 th:text="${#numbers.formatInteger(todayInboundCount, 1, 'COMMA')} + '건'">0건</div>
                        </div>
                        <div class="ff-stat-icon bg-success-subtle text-success">
                            <i class="bi bi-box-arrow-in-down"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-6 col-xl-3">
                <div class="card ff-card h-100">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-muted small">오늘 입고 수량</div>
                            <div class="ff-stat-value text-success"
                                 th:text="${#numbers.formatInteger(todayInboundQuantity, 1, 'COMMA')}">0</div>
                        </div>
                        <div class="ff-stat-icon bg-success-subtle text-success">
                            <i class="bi bi-plus-circle"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 검색 필터 -->
        <div class="card ff-card ff-filter-card mb-3">
            <div class="card-body">
                <form th:action="@{/admin/inventory}" method="get" class="row g-2 align-items-end">
                    <div class="col-12 col-md-4">
                        <label for="productId" class="form-label">품목</label>
                        <select id="productId" name="productId" class="form-select form-select-sm">
                            <option value="">전체</option>
                            <option th:each="p : ${products}"
                                    th:value="${p.productId}"
                                    th:text="${p.productCode} + ' | ' + ${p.name}"
                                    th:selected="${selectedProductId != null and p.productId == selectedProductId}">
                            </option>
                        </select>
                    </div>

                    <div class="col-6 col-md-3">
                        <label for="binId" class="form-label">구역 코드</label>
                        <select id="binId" name="binId" class="form-select form-select-sm">
                            <option value="">전체</option>
                            <option th:each="b : ${bins}"
                                    th:value="${b.binId}"
                                    th:text="${b.binCode}"
                                    th:selected="${selectedBinId != null and b.binId == selectedBinId}">
                            </option>
                        </select>
                    </div>

                    <div class="col-6 col-md-2">
                        <label for="zone" class="form-label">구역(Zone)</label>
                        <select id="zone" name="zone" class="form-select form-select-sm">
                            <option value="">전체</option>
                            <option th:each="z : ${zones}" th:value="${z}" th:text="${z}"
                                    th:selected="${z == selectedZone}">A</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-sm btn-dark flex-grow-1">
                            <i class="bi bi-search me-1"></i>검색
                        </button>
                        <a th:href="@{/admin/inventory}" class="btn btn-sm btn-outline-secondary">초기화</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- 재고 목록 -->
        <div class="card ff-card">
            <div class="card-header bg-white border-0 pt-3 d-flex justify-content-between align-items-center">
                <div>
                    <span class="fw-bold"><i class="bi bi-stack me-1"></i>재고 현황 (로트 × 구역)</span>
                    <span class="text-muted small ms-2">
                        조회 <span th:text="${#lists.size(inventories)}">0</span>건
                    </span>
                </div>
                <a th:href="@{/admin/inventory/inbound}" class="btn btn-sm btn-success">
                    <i class="bi bi-box-arrow-in-down me-1"></i>입고 등록
                </a>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th style="width: 120px;">품목 코드</th>
                            <th>품목명</th>
                            <th style="width: 190px;">로트번호</th>
                            <th class="text-center" style="width: 110px;">제조일자</th>
                            <th class="text-center" style="width: 110px;">유통기한</th>
                            <th class="text-center" style="width: 130px;">잔여</th>
                            <th style="width: 110px;">구역</th>
                            <th class="text-end" style="width: 100px;">보관 수량</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(inventories)}">
                            <td colspan="8" class="text-center text-muted py-4">
                                조회된 재고가 없습니다. 입고 등록을 먼저 진행해 주세요.
                            </td>
                        </tr>

                        <tr th:each="inv : ${inventories}"
                            th:classappend="${inv.expired} ? 'ff-row-inactive'">
                            <td><span class="ff-code" th:text="${inv.productCode}">FD-CT-001</span></td>
                            <td>
                                <span th:text="${inv.productName}">품목명</span>
                                <span class="badge bg-light text-dark border ms-1"
                                      th:text="${inv.animalType}">소</span>
                            </td>
                            <td><span class="ff-code small" th:text="${inv.lotNo}">LOT</span></td>
                            <td class="text-center small"
                                th:text="${#temporals.format(inv.manufacturedDate, 'yyyy-MM-dd')}">-</td>
                            <td class="text-center small"
                                th:text="${#temporals.format(inv.expirationDate, 'yyyy-MM-dd')}">-</td>
                            <td class="text-center">
                                <span class="badge" th:classappend="${inv.dDayBadgeClass}"
                                      th:text="${inv.dDayLabel}">D-0</span>
                            </td>
                            <td>
                                <span class="ff-code" th:text="${inv.binCode}">A-01-01</span>
                                <div class="text-muted" style="font-size: .72rem;"
                                     th:text="${inv.locationLabel}">A구역</div>
                            </td>
                            <td class="text-end fw-semibold"
                                th:text="${#numbers.formatInteger(inv.quantity, 1, 'COMMA')}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <p class="text-muted small mb-0 mt-2">
                    <i class="bi bi-info-circle me-1"></i>
                    유통기한이 가까운 순으로 정렬됩니다. (선입선출/FEFO 출고 기준)
                </p>
            </div>
        </div>

    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
