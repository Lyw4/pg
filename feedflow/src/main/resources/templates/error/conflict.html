<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('동시 처리 충돌')}"></head>

<body>

<div class="ff-login-wrap">
    <div class="card ff-login-card shadow-lg">
        <div class="card-body p-4 p-md-5 text-center">

            <div class="display-5 text-warning mb-3"><i class="bi bi-arrow-repeat"></i></div>
            <h5 class="fw-bold mb-2">동시에 처리된 요청입니다</h5>

            <p class="text-muted small mb-4" th:text="${errorMessage}">
                다른 사용자가 같은 재고를 동시에 처리했습니다.
            </p>

            <div class="alert alert-light border small text-start">
                <i class="bi bi-shield-check me-1"></i>
                재고 데이터는 <strong>안전하게 보호</strong>되었습니다.
                두 요청이 겹치면 나중 요청을 취소해 재고가 어긋나는 것을 막습니다.
                최신 재고를 확인한 뒤 다시 시도해 주세요.
            </div>

            <div class="d-grid gap-2">
                <a class="btn btn-success" th:href="@{/admin/inventory}">
                    <i class="bi bi-stack me-1"></i>재고 현황 확인
                </a>
                <button type="button" class="btn btn-outline-secondary" onclick="history.back();">
                    이전 화면으로
                </button>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
