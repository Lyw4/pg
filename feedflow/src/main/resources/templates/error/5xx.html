<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('서버 오류')}"></head>

<body>

<div class="ff-login-wrap">
    <div class="card ff-login-card shadow-lg">
        <div class="card-body p-4 p-md-5 text-center">

            <div class="display-5 text-danger mb-3"><i class="bi bi-bug-fill"></i></div>
            <h5 class="fw-bold mb-2">서버 처리 중 오류가 발생했습니다</h5>

            <p class="text-muted small mb-4">
                잠시 후 다시 시도해 주세요. 문제가 계속되면 관리자에게 문의하세요.<br>
                <span class="ff-code" th:if="${timestamp}" th:text="${timestamp}"></span>
            </p>

            <div class="d-grid gap-2">
                <a class="btn btn-success" th:href="@{/admin/dashboard}">
                    <i class="bi bi-speedometer2 me-1"></i>대시보드로 이동
                </a>
                <button type="button" class="btn btn-outline-secondary" onclick="history.back();">
                    이전 화면으로
                </button>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
