<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ============================================================
     공통 head
     ============================================================ -->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|FeedFlow Admin · ${pageTitle}|">FeedFlow Admin</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<!-- ============================================================
     좌측 네비게이션 (GNB)
     ============================================================ -->
<div th:fragment="sidebar">
<aside class="ff-sidebar" id="ffSidebar">
    <div class="ff-brand d-flex align-items-start justify-content-between">
        <div>
            <i class="bi bi-box-seam"></i>
            <span>FeedFlow</span>
            <small class="d-block text-white-50">배합사료 유통 관리</small>
        </div>
        <!-- 모바일 전용 닫기 버튼 -->
        <button type="button" class="btn btn-sm btn-link text-white-50 p-0 d-lg-none"
                id="ffSidebarClose" aria-label="메뉴 닫기">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <ul class="nav flex-column ff-nav">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/dashboard}"
               th:classappend="${menu == 'dashboard'} ? 'active'">
                <i class="bi bi-speedometer2 me-2"></i>대시보드
            </a>
        </li>

        <!-- 기준 정보 (Master Data) : STAFF, ADMIN 공통 -->
        <li class="nav-item mt-3">
            <span class="ff-nav-title">기준 정보</span>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/products}"
               th:classappend="${menu == 'products'} ? 'active'">
                <i class="bi bi-box2 me-2"></i>품목 관리
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/bins}"
               th:classappend="${menu == 'bins'} ? 'active'">
                <i class="bi bi-grid-3x3-gap me-2"></i>창고 구역 관리
            </a>
        </li>

        <!-- 재고 관리 : STAFF, ADMIN 공통 -->
        <li class="nav-item mt-3">
            <span class="ff-nav-title">재고 관리</span>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/inventory}"
               th:classappend="${menu == 'inventory' and subMenu == 'list'} ? 'active'">
                <i class="bi bi-stack me-2"></i>재고 현황
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/inventory/inbound}"
               th:classappend="${menu == 'inventory' and subMenu == 'inbound'} ? 'active'">
                <i class="bi bi-box-arrow-in-down me-2"></i>입고 등록
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/inventory/movements}"
               th:classappend="${menu == 'inventory' and subMenu == 'movements'} ? 'active'">
                <i class="bi bi-clock-history me-2"></i>입출고 이력
            </a>
        </li>

        <!-- 현장 작업 : STAFF, ADMIN 공통 -->
        <li class="nav-item mt-3">
            <span class="ff-nav-title">현장 작업</span>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/scan}"
               th:classappend="${menu == 'scan'} ? 'active'">
                <i class="bi bi-upc-scan me-2"></i>바코드 스캔
            </a>
        </li>

        <!-- 사원 관리: ADMIN 에게만 렌더링 (DOM 에서 제거) -->
        <li class="nav-item mt-3" sec:authorize="hasRole('ADMIN')">
            <span class="ff-nav-title">시스템 관리</span>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/admin/employees}"
               th:classappend="${menu == 'employees'} ? 'active'">
                <i class="bi bi-people me-2"></i>사원 관리
            </a>
        </li>

        <!-- 출고 관리 : STAFF, ADMIN 공통 -->
        <li class="nav-item mt-3">
            <span class="ff-nav-title">출고 관리</span>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/outbound}"
               th:classappend="${menu == 'outbound' and subMenu == 'list'} ? 'active'">
                <i class="bi bi-box-arrow-up me-2"></i>출고 대기 주문
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/outbound/direct}"
               th:classappend="${menu == 'outbound' and subMenu == 'direct'} ? 'active'">
                <i class="bi bi-arrow-right-square me-2"></i>직접 출고
            </a>
        </li>
    </ul>
</aside>

<!-- 모바일에서 사이드바가 열렸을 때의 배경 (탭하면 닫힘) -->
<div class="ff-sidebar-backdrop" id="ffSidebarBackdrop"></div>
</div>

<!-- ============================================================
     상단 바
     ============================================================ -->
<header th:fragment="topbar(pageTitle)" class="ff-topbar">
    <div class="d-flex align-items-center gap-2 ff-topbar-left">
        <!-- 모바일 전용 메뉴 버튼 -->
        <button type="button" class="btn btn-sm btn-outline-secondary d-lg-none flex-shrink-0"
                id="ffSidebarToggle" aria-label="메뉴 열기">
            <i class="bi bi-list"></i>
        </button>
        <h6 class="mb-0 fw-bold ff-topbar-title" th:text="${pageTitle}">페이지</h6>
    </div>

    <div class="d-flex align-items-center gap-2 flex-shrink-0">
        <div class="text-end small ff-topbar-user">
            <span class="fw-semibold" sec:authentication="principal.displayName">사용자</span>
            <span class="badge"
                  th:with="role=${#authentication.principal.role}"
                  th:classappend="${role.badgeClass}"
                  th:text="${role.name()}">권한</span>
        </div>

        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-secondary text-nowrap">
                <i class="bi bi-box-arrow-right"></i>
                <span class="d-none d-md-inline ms-1">로그아웃</span>
            </button>
        </form>
    </div>
</header>

<!-- ============================================================
     공통 스크립트
     ============================================================ -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin-layout.js}"></script>
</div>

</body>
</html>
