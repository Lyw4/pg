# =====================================================================
# Gradle 빌드 설정
# =====================================================================

# JVM 기본 인코딩을 UTF-8 로 고정한다.
#
# 지정하지 않으면 JVM 이 OS 기본 인코딩을 쓴다.
# 한국어 Windows 는 MS949(CP949) 라서 UTF-8 로 저장된 소스/리소스의 한글이
# 빌드 로그에서 깨져 보인다. (예: "OrderCancellationService 단위 테스트" ->
# "OrderCancellationService ?⑥쐞 ?뚯뒪??")
#
# 소스 파일 자체는 정상이며 이 설정은 '읽고 출력하는 쪽' 을 맞추는 것이다.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx1g

# 변경되지 않은 태스크를 건너뛴다 (재빌드 속도)
org.gradle.caching=true
