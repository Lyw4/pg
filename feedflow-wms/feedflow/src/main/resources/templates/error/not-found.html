<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('데이터 없음')}"></head>

<body>

<div class="ff-login-wrap">
    <div class="card ff-login-card shadow-lg">
        <div class="card-body p-4 p-md-5 text-center">

            <div class="display-5 text-secondary mb-3"><i class="bi bi-search"></i></div>
            <h5 class="fw-bold mb-2">데이터를 찾을 수 없습니다</h5>
            <p class="text-muted small mb-4" th:text="${errorMessage}">
                요청한 데이터가 존재하지 않습니다.
            </p>

            <div class="d-grid gap-2">
                <a class="btn btn-success" th:href="@{/admin/dashboard}">
                    <i class="bi bi-speedometer2 me-1"></i>대시보드로 이동
                </a>
                <a class="btn btn-outline-secondary" th:href="@{/admin/products}">품목 목록으로 이동</a>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
