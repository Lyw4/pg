<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('요청을 처리할 수 없습니다')}"></head>

<body>

<div class="ff-login-wrap">
    <div class="card ff-login-card shadow-lg">
        <div class="card-body p-4 p-md-5 text-center">

            <div class="display-5 text-warning mb-3"><i class="bi bi-exclamation-diamond-fill"></i></div>
            <h5 class="fw-bold mb-2">요청을 처리할 수 없습니다</h5>

            <p class="text-muted small mb-1">
                <span th:text="${status}">400</span>
                <span th:text="${error}">Bad Request</span>
            </p>
            <p class="text-muted small mb-4" th:if="${message}" th:text="${message}"></p>

            <div class="d-grid gap-2">
                <a class="btn btn-success" th:href="@{/admin/dashboard}">
                    <i class="bi bi-speedometer2 me-1"></i>대시보드로 이동
                </a>
                <a class="btn btn-outline-secondary" th:href="@{/login}">로그인 화면</a>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
