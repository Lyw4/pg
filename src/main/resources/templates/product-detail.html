<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title th:text="${product.name + ' | Feed Flow'}">
        상품 상세 | Feed Flow
    </title>

    <link
        rel="stylesheet"
        th:href="@{/css/app.css}">
</head>

<body>

    <header
        th:replace="~{fragments :: header('inventory')}">
    </header>

    <main class="container product-detail-page">

        <div class="detail-breadcrumb">
            <a th:href="@{/inventory}">재고 관리</a>
            <span>›</span>
            <span th:text="${product.animalType}">카테고리</span>
            <span>›</span>
            <strong th:text="${product.name}">상품명</strong>
        </div>

        <section class="product-hero">

            <!-- 상품 이미지 -->
            <div class="product-image-area">

                <img
                    th:src="${productImageUrl}"
                    th:alt="${product.name}">

                <div class="product-package-label">
                    <span class="package-maker"
                        th:text="${product.manufacturer.companyName}">
                        제조사
                    </span>
                    <small>PRODUCT TRACE LABEL</small>
                    <strong th:text="${product.name}">상품명</strong>
                    <span class="package-lot"
                        th:if="${representativeLot != null}"
                        th:text="|LOT ${representativeLot.lotNo} · ${product.weightKg} kg|">
                        LOT
                    </span>
                    <span class="package-lot"
                        th:unless="${representativeLot != null}"
                        th:text="|${product.animalType} · ${product.weightKg} kg|">
                        상품 규격
                    </span>
                </div>

            </div>

            <!-- 상품 기본 정보 -->
            <div class="product-detail-info">

                <div class="detail-topline">

                    <span
                        class="product-category"
                        th:text="${product.animalType}">
                        카테고리
                    </span>

                    <span
                        class="badge"
                        th:classappend="${product.lowStock} ? 'red' : 'green'"
                        th:text="${product.lowStock} ? '재고 보충 필요' : '재고 정상'">
                        재고 정상
                    </span>

                </div>

                <h1 th:text="${product.name}">
                    상품명
                </h1>

                <p
                    class="detail-manufacturer"
                    th:text="|${product.manufacturer.companyName} 제조|">
                    제조사
                </p>

                <p
                    class="detail-description"
                    th:text="${#strings.isEmpty(product.description)
                        ? '등록된 상품 설명이 없습니다.'
                        : product.description}">
                    상품 설명
                </p>

                <div class="detail-price">

                    <strong
                        th:text="|${#numbers.formatInteger(product.price, 0, 'COMMA')}원|">
                        0원
                    </strong>

                    <span th:text="|/ ${product.weightKg} kg|">
                        / 20 kg
                    </span>

                </div>

                <div class="detail-stock-cards">

                    <article>
                        <span>현재 재고</span>

                        <strong th:text="|${product.totalStock} 포|">
                            0 포
                        </strong>
                    </article>

                    <article>
                        <span>안전 재고</span>

                        <strong th:text="|${product.safetyStock} 포|">
                            0 포
                        </strong>
                    </article>

                    <article>
                        <span>등록 LOT</span>

                        <strong th:text="|${#lists.size(productLots)}개|">
                            0개
                        </strong>
                    </article>

                </div>

                <a
                    class="primary detail-back-button"
                    th:href="@{/inventory}">
                    재고 목록으로 돌아가기
                </a>

            </div>

        </section>

        <!-- 해당 상품의 LOT -->
        <section class="panel detail-lot-panel">

            <div class="panel-title">
                <div>
                    <h2>LOT별 상세 재고</h2>
                    <p>유통기한이 빠른 순서로 표시합니다.</p>
                </div>
            </div>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>LOT 번호</th>
                            <th>제조일</th>
                            <th>유통기한</th>
                            <th>창고 위치</th>
                            <th>LOT 재고</th>
                            <th>상태</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="lot : ${productLots}">

                            <td>
                                <a
                                    class="product-link"
                                    th:href="@{/inventory/lots/{id}(id=${lot.lotId})}"
                                    th:text="${lot.lotNo}">
                                    LOT 번호
                                </a>
                            </td>

                            <td th:text="${lot.manufacturedDate}">
                                제조일
                            </td>

                            <td th:text="${lot.expirationDate}">
                                유통기한
                            </td>

                            <td
                                th:text="${#strings.isEmpty(lot.warehouseLocation)
                                    ? '위치 미지정'
                                    : lot.warehouseLocation}">
                                창고 위치
                            </td>

                            <td>
                                <strong th:text="${lot.lotQuantity}">
                                    0
                                </strong>
                                포
                            </td>

                            <td>
                                <span
                                    class="lot-status-badge"
                                    th:classappend="${productLotStatuses[lot.lotId].cssClass}"
                                    th:text="${lot.lotQuantity > 0
                                        ? productLotStatuses[lot.lotId].label
                                        : '소진'}">
                                    정상
                                </span>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(productLots)}">
                            <td
                                colspan="6"
                                class="empty">
                                등록된 LOT가 없습니다.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</body>
</html>
