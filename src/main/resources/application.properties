spring.application.name=finalProject

# H2 / JPA
spring.datasource.url=jdbc:h2:file:./data/finalproject;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Form method support
spring.mvc.hiddenmethod.filter.enabled=true

# Kakao Maps Web SDK (optional)
# Set environment variable KAKAO_MAP_JAVASCRIPT_KEY to enable map preview.
kakao.maps.javascript-key=${KAKAO_MAP_JAVASCRIPT_KEY:}
