spring.application.name=finalProject
server.port=8080
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# H2 / JPA
spring.datasource.url=jdbc:h2:file:./data/finalproject;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Seoul

# Thymeleaf
spring.thymeleaf.cache=false

# Form method support
spring.mvc.hiddenmethod.filter.enabled=true

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload.path=D:/dev/upload/

server.error.include-message=always

# Kakao Maps Web SDK (optional)
kakao.maps.javascript-key=${KAKAO_MAP_JAVASCRIPT_KEY:}

# 관리자 API 계정은 환경변수로만 주입합니다.
feedflow.admin.username=${FEEDFLOW_ADMIN_USERNAME:}
feedflow.admin.password=${FEEDFLOW_ADMIN_PASSWORD:}
