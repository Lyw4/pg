spring.datasource.url=jdbc:h2:mem:feedflow-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 메인 설정이 MySQL 방언을 고정하고 있어 테스트에서 반드시 덮어써야 한다.
# 안 덮으면 H2 에 MySQL DDL 을 던져 스키마 생성이 조용히 실패하고,
# 모든 테스트가 "Table ... not found (this database is empty)" 로 깨진다.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
feedflow.password-reset.expose-code=true
feedflow.admin.password=test-admin-password
feedflow.staff.password=test-staff-password
feedflow.upload.product-image-dir=${java.io.tmpdir}/feedflow-test-product-images
feedflow.inventory.demand-baseline-enabled=false
feedflow.demo.farm-deliveries-enabled=false
